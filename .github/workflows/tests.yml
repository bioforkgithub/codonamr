name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package with its dev extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The network marker is deselected so the suite never touches NCBI.
      # ViennaRNA is not installed here on purpose: the folding path is
      # optional and the package has to pass without it.
      - name: Run the offline test suite
        run: python -m pytest tests/ -q -m "not network"

      - name: Check the command line entry point
        run: |
          codonamr version
          codonamr --help
