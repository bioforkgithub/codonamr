[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codonamr"
version = "0.1.0"
description = "Codon usage analysis of antimicrobial resistance genes, with length and composition controls that are themselves validated."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Manish Prakash Victor" }]
maintainers = [{ name = "Manish Prakash Victor" }]
keywords = [
    "codon usage", "antimicrobial resistance", "AMR", "codon adaptation index",
    "effective number of codons", "tRNA adaptation index", "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "biopython>=1.79",
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
folding = ["ViennaRNA>=2.5"]
dev = ["pytest>=7.0", "pytest-cov>=3.0"]

[project.urls]
Homepage = "https://github.com/bioforkgithub/codonamr"
Issues = "https://github.com/bioforkgithub/codonamr/issues"
Documentation = "https://github.com/bioforkgithub/codonamr/blob/main/docs/index.md"

[project.scripts]
codonamr = "codonamr.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not network'"
markers = [
    "network: test needs the internet and an NCBI contact address in CODONAMR_EMAIL (deselected by default)",
]
filterwarnings = ["ignore::DeprecationWarning"]
